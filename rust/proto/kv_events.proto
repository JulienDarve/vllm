syntax = "proto3";
package vllm;

import "inference.proto";

// KV cache events of the engine, as its ZMQ publisher emits them
// (`vllm/distributed/kv_events.py`), with the same sequence numbers.
service KvEvents {
  // Streams the KV cache events of one data-parallel rank, from the next
  // batch the engine publishes, in sequence-number order. As with the ZMQ
  // publisher, batches can be lost: a gap in the sequence numbers means the
  // engine's publisher dropped them, the server could not decode them, or the
  // subscriber fell too far behind.
  //
  // Each batch is one message, however large; raise the client's receive
  // limit above gRPC's default 4 MiB for long prompts.
  //
  // INVALID_ARGUMENT: the rank is not connected to this server.
  // FAILED_PRECONDITION: the engine does not publish KV cache events.
  // UNAVAILABLE: the engine's publisher did not answer, or the server is
  //   shutting down.
  rpc SubscribeKvEvents (SubscribeKvEventsRequest) returns (stream SubscribeKvEventsResponse) {}

  // Streams the blocks that one data-parallel rank's device cache (medium
  // `GPU`) holds, as the stores that recreate them: applied in order to an
  // empty state, they give the state after every batch numbered below
  // `end.next_sequence_number`. A block follows its parent, and a block held
  // more than once is stored once per copy. Left out: a block whose parent is
  // not held, with its copies, and the blocks of a store whose tokens do not
  // divide evenly among its blocks. A client that loaded the snapshot can
  // therefore drop such a block while the cache still holds a copy. The last
  // response is `end`; a stream that ends without it is not a snapshot.
  //
  // To follow the cache from a snapshot: subscribe, wait for the response
  // headers, take the snapshot, then apply the batches numbered
  // `end.next_sequence_number` and above. The snapshot holds every batch
  // forwarded to a subscriber before the call arrived.
  //
  // INVALID_ARGUMENT: the rank is not connected to this server.
  // FAILED_PRECONDITION: the engine does not publish KV cache events, or
  //   `grpc_snapshot` is false in its KV events config.
  // UNAVAILABLE: the server has not connected to the engine's publisher yet,
  //   or is shutting down.
  rpc GetKvSnapshot (GetKvSnapshotRequest) returns (stream GetKvSnapshotResponse) {}
}

message GetKvSnapshotRequest {
  uint32 data_parallel_rank = 1;
}

message GetKvSnapshotResponse {
  oneof item {
    KvSnapshotBlocks blocks = 1;
    // Always last.
    KvSnapshotEnd end = 2;
  }
}

message KvSnapshotBlocks {
  // `session_id` is never set: it describes a store event, not a block.
  repeated BlockStored stored = 1;
}

message KvSnapshotEnd {
  // The first batch the snapshot does not include.
  uint64 next_sequence_number = 1;
  // False when the server missed batches, among them any the engine published
  // before the server connected, so the snapshot may lack blocks the cache
  // holds or hold blocks the cache dropped. True again once the engine clears
  // its cache.
  bool complete = 2;
}

message SubscribeKvEventsRequest {
  uint32 data_parallel_rank = 1;
}

message SubscribeKvEventsResponse {
  oneof item {
    KvEventBatch batch = 1;
  }
}

// `KVEventBatch` (`[ts, events, data_parallel_rank]`) and its sequence number.
message KvEventBatch {
  uint64 sequence_number = 1;
  double ts = 2;
  optional uint32 data_parallel_rank = 3;
  repeated KvCacheEvent events = 4;
}

message KvCacheEvent {
  oneof event {
    BlockStored block_stored = 1;
    BlockRemoved block_removed = 2;
    AllBlocksCleared all_blocks_cleared = 3;
  }
}

// `ExternalBlockHash`.
message BlockHash {
  oneof value {
    // With VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES (the default).
    uint64 unsigned_value = 1;
    // A KV connector that publishes its own hashes as negative integers.
    int64 signed_value = 2;
    // Without VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES.
    bytes digest = 3;
  }
}

message BlockStored {
  repeated BlockHash block_hashes = 1;
  // Unset for a block without a parent.
  BlockHash parent_block_hash = 2;
  // Across all blocks of the event.
  repeated uint32 token_ids = 3;
  uint32 block_size = 4;
  // Deprecated in favor of `lora_name`.
  optional int64 lora_id = 5;
  optional string medium = 6;
  optional string lora_name = 7;
  // One entry per block, empty for a block without keys.
  repeated BlockExtraKeys extra_keys = 8;
  optional uint32 group_idx = 9;
  optional string kv_cache_spec_kind = 10;
  optional uint32 kv_cache_spec_sliding_window = 11;
  optional string locality = 12;
  optional string ownership = 13;
  optional string session_id = 14;
  // One entry per block; empty when lookahead hashing is off.
  repeated TokenIds lookahead_token_ids = 15;
  // The event reports blocks that a request reused (`kv_cache_report_mode`
  // "full"): they were already stored, and no copy was added.
  bool reuse_report = 16;
}

message BlockRemoved {
  repeated BlockHash block_hashes = 1;
  optional string medium = 2;
  optional uint32 group_idx = 3;
  optional string locality = 4;
  optional string ownership = 5;
}

message AllBlocksCleared {}

// The untagged keys of one block, as published: the LoRA name,
// `(mm_identifier, offset)` pairs, the cache salt and prompt embedding digests.
message BlockExtraKeys {
  repeated ExtraKeyValue keys = 1;
}

message ExtraKeyValue {
  oneof value {
    string text = 1;
    bytes data = 2;
    int64 integer = 3;
    ExtraKeyTuple tuple = 4;
  }
}

message ExtraKeyTuple {
  repeated ExtraKeyValue items = 1;
}
